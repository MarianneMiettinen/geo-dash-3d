<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Geo Dash 3D</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">BEST 0</div>
  </div>

  <div id="turnCue" class="hidden"><span id="turnText">TURN LEFT</span></div>

  <div id="flash"></div>
  <div id="shiftText" class="hidden">DIMENSION SHIFT</div>

  <div id="panel" class="hidden">
    <h1 id="panelTitle">GEO DASH 3D</h1>
    <p id="panelBody">Jump the blocks. Survive long enough and the world turns inside out.</p>
    <p class="keys" id="panelKeys">SPACE / TAP&nbsp;— jump</p>
    <button id="panelBtn">START</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
